[project]
name = "novelbang"
version = "0.1.1"
description = "Local-first novel writing studio with a llama-powered co-writer and ebook export"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "markdown>=3.6",
    "tomli-w>=1.0",
]

[project.scripts]
novelbang = "novelbang.cli:main"
novelbang-desktop = "novelbang.desktop:main"

[project.optional-dependencies]
desktop = [
    "pywebview>=6.2.1",
]

[build-system]
requires = ["uv_build>=0.8,<0.10"]
build-backend = "uv_build"

[dependency-groups]
build = [
    "pillow>=13.0.0",
    "pyinstaller>=6.22.3",
]
dev = ["pytest>=8"]
