# Pushing a version tag builds the Mac and Windows apps and publishes a GitHub Release:
#   (bump version in pyproject.toml, commit)  git tag v0.2.0 && git push origin v0.2.0
# Running it by hand (Actions → Release → Run workflow) builds without releasing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        runner: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa  # v10.3.1
        with:
          enable-cache: true

      - name: Check the tag matches pyproject.toml
        if: github.ref_type == 'tag' && runner.os == 'Linux'
        run: |
          version=$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in pyproject.toml (expected v$version)"
            exit 1
          fi

      - run: uv run pytest -q

  build-macos:
    needs: test
    strategy:
      matrix:
        runner: [macos-15, macos-15-intel]  # Apple silicon, Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa  # v10.3.1
        with:
          enable-cache: true

      # Signing and notarizing need these repository secrets (see README → Signing the Mac app).
      # Without them the app is built unsigned, as before.
      - name: Set up signing
        id: signing
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [[ -z "$MACOS_CERTIFICATE" ]]; then
            echo "::warning::No MACOS_CERTIFICATE secret: the Mac app is not signed, so macOS will block it on other Macs"
            exit 0
          fi
          for name in MACOS_CERTIFICATE_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name}" ]]; then
              echo "::error::MACOS_CERTIFICATE is set but $name isn't: signing needs all five secrets"
              exit 1
            fi
          done

          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -base64 24)
          security create-keychain -p "$password" "$keychain"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"  # removed at the end of the job
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          # Apple's intermediate, which a certificate exported from Keychain Access usually leaves out.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          identity=$(security find-identity -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)
          if [[ -z "$identity" ]]; then
            echo "::error::MACOS_CERTIFICATE has no Developer ID Application certificate and key"
            security find-identity -p codesigning "$keychain"
            exit 1
          fi
          printf '%s\n' "$APPLE_API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "MACOS_SIGN_IDENTITY=$identity"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"

      - run: packaging/build-macos.sh

      - name: Check the built app starts
        env:
          NOVELBANG_WORKSPACE: ${{ runner.temp }}/novels
          NOVELBANG_NO_OLLAMA: "1"
        run: |
          dist/NovelBang.app/Contents/MacOS/NovelBang &
          app=$!
          for _ in $(seq 60); do
            curl -sf -o /dev/null http://127.0.0.1:47865/static/app.js && up=1 && break
            sleep 1
          done
          kill $app || true
          if [[ -z "${up:-}" ]]; then
            echo "::error::The app didn't start"
            cat ~/Library/Logs/NovelBang/novelbang.log || true
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ runner.arch }}
          path: dist/*.dmg
          if-no-files-found: error

      - name: Remove the signing keychain
        if: always() && steps.signing.outputs.keychain
        run: |
          security delete-keychain "${{ steps.signing.outputs.keychain }}"
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/certificate.p12"

  build-windows:
    needs: test
    runs-on: windows-2025  # has Inno Setup 6
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa  # v10.3.1
        with:
          enable-cache: true

      # Signing: set the repository variable WINDOWS_SIGN_CERT to the certificate's SHA-1
      # thumbprint (and, optionally, WINDOWS_SIGN_TIMESTAMP_URL), and add your signing
      # provider's setup step here, before the build, to put that certificate in the Windows
      # certificate store. See README → Signing the Windows app. Without it the build is unsigned.
      #
      # - name: Set up the signing certificate
      #   env:
      #     PROVIDER_PASSWORD: ${{ secrets.PROVIDER_PASSWORD }}
      #   run: …

      - name: Build
        env:
          WINDOWS_SIGN_CERT: ${{ vars.WINDOWS_SIGN_CERT }}
          WINDOWS_SIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGN_TIMESTAMP_URL }}
        run: |
          if (-not $env:WINDOWS_SIGN_CERT) {
            Write-Host "::warning::No WINDOWS_SIGN_CERT variable: the Windows app is not signed, so SmartScreen will warn"
          }
          packaging/build-windows.ps1

      - name: Check the installer installs an app that starts
        env:
          NOVELBANG_WORKSPACE: ${{ runner.temp }}\novels
          NOVELBANG_LOG_DIR: ${{ runner.temp }}\logs
          NOVELBANG_NO_OLLAMA: "1"
        run: |
          $installer = (Get-Item dist\*-x64-setup.exe).FullName
          $setup = Start-Process $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER" -Wait -PassThru
          if ($setup.ExitCode) { throw "The installer failed with exit code $($setup.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA "Programs\NovelBang\NovelBang.exe"
          if (-not (Test-Path $exe)) { throw "NovelBang.exe isn't where the installer should put it: $exe" }

          $app = Start-Process $exe -PassThru
          $up = $false
          foreach ($i in 1..60) {
            try {
              Invoke-WebRequest http://127.0.0.1:47865/static/app.js -UseBasicParsing -TimeoutSec 2 | Out-Null
              $up = $true
              break
            } catch { Start-Sleep 1 }
          }
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          Get-Content "$env:NOVELBANG_LOG_DIR\novelbang.log" -ErrorAction SilentlyContinue
          if (-not $up) { throw "The installed app didn't start" }

          $uninstaller = Join-Path (Split-Path $exe) "unins000.exe"
          Start-Process $uninstaller -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait
          if (Test-Path $exe) { throw "The uninstaller left NovelBang.exe behind" }

      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ runner.arch }}
          path: |
            dist/*-setup.exe
            dist/*-portable.zip
          if-no-files-found: error

  release:
    needs: [build-macos, build-windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MAC_SIGNED: ${{ secrets.MACOS_CERTIFICATE != '' }}
          WINDOWS_SIGNED: ${{ vars.WINDOWS_SIGN_CERT != '' }}
        run: |
          prerelease=()
          [[ "$GITHUB_REF_NAME" =~ (a|b|rc|dev)[0-9]*$ ]] && prerelease=(--prerelease)
          # Shown above GitHub's generated list of changes.
          read -r -d '' notes <<'EOF' || true
          ## Install (macOS)

          Download the DMG for your Mac (**arm64** for Apple silicon, **x86_64** for Intel),
          open it and drag NovelBang into Applications.
          EOF
          if [[ "$MAC_SIGNED" != true ]]; then
            read -r -d '' unsigned <<'EOF' || true
          The app isn't signed with an Apple Developer ID yet, so macOS blocks it the first
          time. Open it once from **System Settings → Privacy & Security → Open Anyway**.
          EOF
            notes+=$'\n\n'"$unsigned"
          fi
          read -r -d '' windows <<'EOF' || true
          ## Install (Windows 10 and 11, x64)

          Download **NovelBang-…-x64-setup.exe** and run it. It installs for your account
          only, with no admin rights needed, and adds NovelBang to the Start menu. Or use the
          **portable .zip**: unzip it anywhere and run `NovelBang.exe`. NovelBang uses the
          Microsoft Edge WebView2 Runtime, which comes with Windows 11 and up-to-date Windows 10.
          EOF
          notes+=$'\n\n'"$windows"
          if [[ "$WINDOWS_SIGNED" != true ]]; then
            read -r -d '' unsigned <<'EOF' || true
          The installer isn't code-signed yet, so Windows SmartScreen may say "Windows
          protected your PC". Choose **More info → Run anyway**.
          EOF
            notes+=$'\n\n'"$unsigned"
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*-setup.exe dist/*-portable.zip "${prerelease[@]}" \
            --verify-tag --title "NovelBang ${GITHUB_REF_NAME#v}" --generate-notes --notes "$notes"
